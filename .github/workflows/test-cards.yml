name: Card tests
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
